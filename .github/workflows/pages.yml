# Publishes VARTISTE to GitHub Pages (https://ariamokr.github.io/vartiste/) on every push to
# release, or by hand: the production build of every entry, as upstream's GitLab Pages job makes
# it (.gitlab-ci.yml, "build" and "pages"), on the current Node LTS (24).
#
# One-time setup: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # src/build-info.js makes the version from the count of merges
          persist-credentials: false

      # About 156 MB of LFS: the gallery, the wasm, the material packs and the assets.
      # chromium/ (the desktop launcher) and art/ (Blender sources) aren't part of the site.
      - name: List the LFS objects the build needs
        run: git lfs ls-files --long --exclude "chromium/**,art/**" | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - run: git lfs pull --exclude "chromium/**,art/**"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node build-build-info.js
        env:
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      - run: npx webpack
        env:
          PROD: 'true'
      - run: rm -rf dist/stats # webpack's bundle statistics (about 115 MB), not part of the site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
